</div>
<p class="font-caption text-caption text-on-surface-variant">Diperlukan untuk sinkronisasi data akun layanan kesehatan SATUSEHAT Kemenkes</p>
</div>
<!-- Field 2: Nomor WhatsApp / HP -->
<div class="space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="username">

<span class="material-symbols-outlined text-[13px]">check_circle</span>

</div>
</div>
<!-- Field 3: Alamat Email -->

</div>
</div>

<span class="material-symbols-outlined text-[20px]">visibility</span>

</div>

<div class="h-1 rounded-full bg-status-open"></div>
<div class="h-1 rounded-full bg-status-open"></div>
<div class="h-1 rounded-full bg-status-open"></div>
</div>
<div class="flex items-center justify-between text-on-surface-variant">
<span class="font-caption text-caption">Min. 8 karakter, huruf besar &amp; angka</span>
<span class="font-caption text-caption text-status-open font-semibold flex items-center space-x-0.5">
<span class="material-symbols-outlined text-[13px]">check_circle</span>
<span class="">Memenuhi standar</span>
</span>
</div>
</div>
</div>

<div class="space-y-1.5">

<span class="material-symbols-outlined absolute right-3.5 text-status-open text-[20px]">check_circle</span>
</div>
</div>

<!-- Terms & Privacy Agreement -->

<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17Z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24Z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.14-1.55.38-2.27V6.58H1.25C.45 8.17 0 9.99 0 12s.45 3.83 1.25 5.42l4.03-3.15Z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z" fill="#EA4335"></path>
</svg>
<span class="">Daftar Cepat dengan Google</span>
</button>

</div>
<!-- Quick Sign In Redirection Card -->
<div class="bg-surface-container rounded-2xl p-space-sm text-center">
<p class="font-body-sm text-body-sm text-on-surface">

<span class="">Masuk ke Akun</span>
<span class="material-symbols-outlined text-[16px]">chevron_right</span>

</p>
