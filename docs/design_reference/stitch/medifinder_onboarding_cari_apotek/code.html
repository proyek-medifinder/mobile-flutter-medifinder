<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta content="mobile_blank" name="shell-type">
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<style>
    @layer base {
      html, body {
        width: 100vw;
        min-height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #FFFFFF;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }
      body {
        overscroll-behavior-y: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 16px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 16px);
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#0F756B",
            "primary-dark": "#0A5A52",
            "teal-light": "#14B8A6",
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    };
  </script>
</head>
<body class="bg-white text-gray-900 min-h-screen flex flex-col justify-between antialiased selection:bg-[#0F756B] selection:text-white">
<main class="flex-1 flex flex-col justify-between w-full max-w-[390px] mx-auto min-h-screen pt-safe pb-safe bg-white px-6">
<!-- Top Header Bar -->
<header class="flex items-center justify-between w-full pt-3 pb-2">
<!-- Brand Logo & Name -->
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-lg bg-[#E6F4F1] flex items-center justify-center text-[#0F756B]">
<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
<path d="M4.5 10.5C3.67 10.5 3 11.17 3 12s.67 1.5 1.5 1.5h4.5V18c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-4.5H16c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5h-4.5V6c0-.83-.67-1.5-1.5-1.5S9 5.17 9 6v4.5H4.5z"></path>
</svg>
</div>
<span class="text-base font-bold tracking-tight text-[#0F756B]">MediFinder</span>
</div>
<!-- Header Skip Action -->
<button class="text-sm font-medium text-gray-400 hover:text-[#0F756B] transition-colors focus:outline-none" type="button">
        Lewati
      </button>
</header>
<!-- Main Visual Illustration Area -->
<div class="flex flex-col items-center justify-center my-auto py-6">
<div class="relative w-64 h-64 rounded-full bg-[#E6F4F1] flex items-center justify-center overflow-hidden">
<!-- Subtle concentric decorative radar rings -->
<div class="absolute inset-3 rounded-full border border-[#0F756B]/10 pointer-events-none"></div>
<div class="absolute inset-8 rounded-full border border-[#0F756B]/5 pointer-events-none"></div>
<!-- 24h Status Badge Pill Floating -->
<div class="absolute top-6 z-20 bg-white px-3 py-1 rounded-full shadow-sm flex items-center space-x-1.5 border border-[#0F756B]/10">
<span class="material-symbols-outlined text-[15px] text-[#14B8A6]" style="font-variation-settings: 'FILL' 1;">near_me</span>
<span class="text-[11px] font-bold text-[#0F756B]">24 Jam Buka</span>
</div>
<!-- Centered Pharmacy SVG Vector Illustration -->
<div class="relative z-10 flex items-center justify-center mt-3">
<svg class="w-36 h-36 drop-shadow-sm" fill="none" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">
<!-- Pharmacy Base Building -->
<rect fill="#FFFFFF" height="62" rx="8" width="70" x="35" y="48"></rect>
<!-- Storefront Awning / Roof -->
<path d="M31 48C31 43.5817 34.5817 40 39 40H101C105.418 40 109 43.5817 109 48V52H31V48Z" fill="#0F756B"></path>
<path d="M39 52C42 54 46 54 49 52C52 54 56 54 59 52C62 54 66 54 69 52C72 54 76 54 79 52C82 54 86 54 89 52C92 54 96 54 101 52" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2"></path>
<!-- Medical Cross Emblem on Clinic Front -->
<circle cx="70" cy="73" fill="#E6F4F1" r="13"></circle>
<path d="M70 65V81M62 73H78" stroke="#0F756B" stroke-linecap="round" stroke-width="3"></path>
<!-- Glass Doors -->
<rect fill="#0F756B" fill-opacity="0.12" height="17" rx="3" width="18" x="61" y="93"></rect>
<circle cx="73" cy="102" fill="#0F756B" r="1.2"></circle>
<!-- Windows -->
<rect fill="#E6F4F1" height="13" rx="2" width="12" x="42" y="66"></rect>
<rect fill="#E6F4F1" height="13" rx="2" width="12" x="86" y="66"></rect>
<!-- GPS Location Pin Marker -->
<g filter="url(#pinDropShadow)">
<path d="M106 31C106 25.4772 101.523 21 96 21C90.4772 21 86 25.4772 86 31C86 38.5 96 49 96 49C96 49 106 38.5 106 31Z" fill="#14B8A6"></path>
<circle cx="96" cy="31" fill="#FFFFFF" r="3.5"></circle>
</g>
<defs>
<filter color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" height="36" id="pinDropShadow" width="28" x="82" y="19">
<feDropShadow dx="0" dy="2" flood-color="#0F756B" flood-opacity="0.25" stdDeviation="2"></feDropShadow>
</filter>
</defs>
</svg>
</div>
<!-- Distance Info Pill Indicator -->
<div class="absolute bottom-5 z-20 bg-white/95 px-3 py-1 rounded-full shadow-sm flex items-center space-x-1 border border-gray-100">
<span class="material-symbols-outlined text-[13px] text-[#14B8A6]">location_on</span>
<span class="text-[11px] font-medium text-gray-600">Radius &lt; 1.2 km dari Anda</span>
</div>
</div>
</div>
<!-- Content & Action Bottom Block -->
<div class="flex flex-col items-center w-full pb-8">
<!-- Title & Subtitle -->
<h1 class="text-[22px] font-bold text-gray-900 text-center tracking-tight mb-2.5 mx-auto">
        Temukan Apotek Terdekat
      </h1>
<p class="text-sm text-gray-500 text-center max-w-xs leading-relaxed mb-7 mx-auto">
        Cari apotek siaga 24 jam di sekitarmu dengan info jarak dan ketersediaan yang akurat.
      </p>
<!-- Stepper / Pagination Dots -->
<div aria-label="Progress onboarding" class="flex items-center justify-center space-x-2 mb-8" role="tablist">
<span aria-current="step" class="w-8 h-2 rounded-full bg-[#0F756B] transition-all"></span>
<span class="w-2 h-2 rounded-full bg-gray-200 transition-all"></span>
<span class="w-2 h-2 rounded-full bg-gray-200 transition-all"></span>
</div>
<!-- Action Navigation Row -->
<div class="flex items-center justify-between w-full">
<!-- Skip button -->
<button class="text-sm font-medium text-gray-500 hover:text-gray-700 px-2 py-2 transition-colors focus:outline-none" type="button">
          Lewati
        </button>
<!-- Continue CTA -->
<button class="flex items-center gap-2 bg-[#0F756B] hover:bg-[#0A5A52] text-white text-sm font-medium px-6 py-3 rounded-full shadow-sm active:scale-95 transition-all focus:outline-none" type="button">
<span class="">Lanjutkan</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</main>


</body></html>
