<!DOCTYPE html>

</svg>

</svg>
</div>
</div>
</div>
</div>
<!-- Content & Interaction Stack -->
<div class="w-full flex flex-col items-center text-center pb-4">
<!-- Pagination Indicator (Dots) -->
<div aria-label="Progress onboarding" class="flex items-center justify-center space-x-1.5 mb-6">
<!-- Dot 1 (Inactive) -->
<span class="w-2 h-2 rounded-full bg-gray-200 transition-all"></span>
<!-- Dot 2 (Inactive) -->
<span class="w-2 h-2 rounded-full bg-gray-200 transition-all"></span>
<!-- Dot 3 (Active) -->
<span class="w-8 h-2 rounded-full bg-[#0F756B] transition-all"></span>
</div>
<!-- Title and Subtitle Content -->
<h1 class="text-2xl font-bold text-gray-900 tracking-tight mb-3">
      Konsultasi Cerdas MediBot

<p class="text-gray-500 text-sm leading-relaxed max-w-xs mx-auto mb-8">
      Dapatkan panduan informasi obat dan rekomendasi apotek terdekat dengan asisten cerdas AI.
    </p>
<!-- Bottom Action Navigation -->
<div class="w-full flex flex-col items-center">

<button class="w-full py-3.5 bg-[#0F756B] hover:bg-[#0A5A52] active:scale-[0.99] text-white font-semibold text-base rounded-full shadow-md text-center flex items-center justify-center gap-2 transition-all cursor-pointer" type="button">
