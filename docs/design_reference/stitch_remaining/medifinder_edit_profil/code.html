<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

econdary":"#ffffff","background":"#f8f9fb","surface-white":"#FFFFFF","primary-fixed":"#9cf2e5","primary-dark":"#0A5A52","surface-container":"#edeef0"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"margin-desktop":"2rem","gutter":"0.75rem","margin-mobile":"1.25rem","margin-tablet":"1.5rem","space-lg":"1.375rem","gutter-desktop":"1.5rem","space-xl":"1.75rem","margin":"1.25rem","space-md":"1rem","space-xs":"0.375rem","space-sm":"0.5rem"},"fontFamily":{"headline-xl":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"caption":["Plus Jakarta Sans"],"headline-xl-mobile":["Plus Jakarta Sans"],"title-md":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"]},"fontSize":{"headline-xl":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"500"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"700"}],"label-sm":["11px",{"lineHeight":"14px","letterSpacing":"0.03em","fontWeight":"600"}],"body-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"headline-lg-mobile":["21px",{"lineHeight":"28px","fontWeight":"700"}],"caption":["10px",{"lineHeight":"12px","letterSpacing":"0.02em","fontWeight":"500"}],"headline-xl-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"700"}],"title-md":["17px",{"lineHeight":"24px","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"22px","fontWeight":"400"}],"headline-md":["18px",{"lineHeight":"24px","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.02em","fontWeight":"600"}]}}}};</script></head><body class="bg-scaffold-base font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col"><header class="fixed top-0 w-full z-50 pt-safe bg-surface-white/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Kembali" class="min-w-[44px] min-h-[44px] -ml-space-xs flex items-center justify-center rounded-full text-primary hover:bg-surface-container-low transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-md text-title-md text-on-surface truncate">Edit Profil</h1></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 w-full bg-scaffold-base pt-16 pb-safe"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Status Feedback Banner / Delight Trigger -->
<div class="fixed top-20 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 transform -translate-y-6 opacity-0 pointer-events-none w-[90%] max-w-[380px] bg-status-open text-on-primary py-3 px-4 rounded-xl shadow-lg flex items-center justify-between" id="saveToast">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-primary font-semibold">Profil berhasil diperbarui</span>
</div>
<span class="material-symbols-outlined text-[18px] opacity-80 cursor-pointer" onclick="closeToast()">close</span>
</div>
<!-- Top Hero: Interactive Avatar Editor -->
<div class="w-full pt-space-md pb-space-lg flex flex-col items-center text-center">
<div class="relative group">
<!-- Avatar Outer Halo -->
<div class="w-28 h-28 rounded-full p-1 bg-gradient-to-tr from-teal-light to-primary shadow-[0_8px_20px_0_rgba(20,184,166,0.25)] flex items-center justify-center">
<div class="w-full h-full rounded-full overflow-hidden bg-surface-container">
<img class="w-full h-full object-cover" data-alt="Close-up portrait of a warm, smiling young Indonesian woman named Sarah Safira with natural makeup and neat dark hair, gentle warm clinical daylight, soft teal ambiance, sharp studio portraiture." id="avatarPreview" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCqQo48eQa7XJvPi8kj_Mf-JowKLOeVF3qLNuGUVy0j_i3fjYed7TH6C9po_CVrrgovxmCozBDp9wGE-rC2IHqa-rjlnBUCeRu9atF0plQg3CTAO17h5jt8mE7AYA5vAkkt932TbjOrNiB2pvnJxtpRgYxRiH2Qo2PaK7femPMnH3-Y50j_4f2KhzDZ-7Urz5I_JGwrEWzwjHeeLxkeeLr2V1aGgGNCxkgKYpoj0OD">
</div>
</div>
<!-- Change Photo Action Badge -->
<label class="absolute bottom-0 right-0 w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-md active:scale-95 transition-transform cursor-pointer" for="avatarUploadInput">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
<input accept="image/png, image/jpeg" class="sr-only" id="avatarUploadInput" onchange="previewAvatar(event)" type="file">
</label>
</div>
<!-- Avatar Micro Metadata -->
<div class="mt-space-sm flex flex-col items-center">
<button class="font-label-md text-label-md text-primary font-bold hover:underline flex items-center gap-1" onclick="document.getElementById('avatarUploadInput').click()" type="button">
<span class="">Ubah Foto Profil</span>
</button>
<p class="font-caption text-caption text-outline mt-0.5">Maksimal 2 MB (JPG, PNG)</p>
</div>
</div>
<form class="w-full flex flex-col gap-space-lg" id="editProfileForm" onsubmit="handleFormSubmit(event)">
<!-- Section 1: Informasi Akun & Data Diri -->
<div class="w-full bg-surface-white rounded-2xl p-space-md shadow-[0_6px_16px_-2px_rgba(10,90,82,0.06)] flex flex-col gap-space-md"><div class="flex items-center gap-space-xs pb-1">
<div class="w-7 h-7 rounded-lg bg-surface-container-low text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]">badge</span>
</div>
<h2 class="font-title-md text-title-md text-on-surface">Informasi Akun</h2>
</div>
<!-- Nama Lengkap -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold" for="fullName">Nama Lengkap</label>
<div class="w-full h-[52px] bg-surface-container-low rounded-xl px-3.5 flex items-center focus-within:bg-surface-white focus-within:shadow-[0_0_0_2px_#005b52] transition-all">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">person</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface outline-none" id="fullName" name="fullName" placeholder="Masukkan nama lengkap" required="" type="text" value="Sarah Safira">
</div>
</div>
<!-- Username -->
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold" for="username">Username</label>
<div class="w-full h-[52px] bg-surface-container-low rounded-xl px-3.5 flex items-center focus-within:bg-surface-white focus-within:shadow-[0_0_0_2px_#005b52] transition-all">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">alternate_email</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface outline-none" id="username" name="username" placeholder="nama_pengguna" required="" type="text" value="sarahsafira">
</div>
</div>
<!-- Kata Sandi / Password -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-semibold" for="password">Kata Sandi / Password</label>
</div>
<div class="w-full h-[52px] bg-surface-container-low rounded-xl px-3.5 flex items-center focus-within:bg-surface-white focus-within:shadow-[0_0_0_2px_#005b52] transition-all">
<span class="material-symbols-outlined text-outline text-[20px] mr-2.5">lock</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface outline-none" id="password" name="password" placeholder="••••••••••••" type="password" value="password123">
<button aria-label="Tampilkan kata sandi" class="text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1" onclick="const p = document.getElementById('password'); const icon = this.querySelector('span'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility'; } else { p.type = 'password'; icon.textContent = 'visibility_off'; }" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-caption text-caption text-outline pl-1">Minimal 8 karakter dengan kombinasi huruf dan angka.</p>
</div></div>
<!-- Section 2: Catatan Medis & Alergi -->

<!-- Action Buttons -->
<div class="w-full flex flex-col gap-space-sm pt-space-xs">
<button class="w-full h-14 bg-primary hover:bg-primary-dark active:scale-[0.99] text-on-primary font-body-lg text-body-lg font-semibold rounded-2xl shadow-[0_8px_20px_-4px_rgba(15,117,107,0.3)] transition-all flex items-center justify-center gap-2" id="saveButton" type="submit">
<span class="material-symbols-outlined text-[20px]">save</span>
<span class="">Simpan Perubahan</span>
</button>
<button class="w-full h-12 bg-surface-container-low hover:bg-surface-container text-on-surface-variant active:scale-[0.99] font-body-md text-body-md font-semibold rounded-xl transition-all flex items-center justify-center" onclick="history.back()" type="button">
<span class="">Batal</span>
</button>
</div>
</form>
</div>
<script>
  function selectBloodType(button, type) {
    const buttons = document.querySelectorAll('.blood-btn');
    buttons.forEach(btn => {
      btn.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
      btn.classList.add('bg-surface-container-low', 'text-on-surface-variant');
    });

    button.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
    button.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');

    document.getElementById('selectedBloodType').value = type;
  }

  function previewAvatar(event) {
    const input = event.target;
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('avatarPreview').src = e.target.result;
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function handleFormSubmit(event) {
    event.preventDefault();
    const saveBtn = document.getElementById('saveButton');
    const toast = document.getElementById('saveToast');
    
    // Quick micro-interaction loading animation
    const originalText = saveBtn.innerHTML;
    saveBtn.disabled = true;
    saveBtn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
      <span>Menyimpan...</span>
    `;

    setTimeout(() => {
      saveBtn.disabled = false;
      saveBtn.innerHTML = originalText;

      // Show toast
      toast.classList.remove('opacity-0', '-translate-y-6', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        closeToast();
      }, 3500);
    }, 700);
  }

  function closeToast() {
    const toast = document.getElementById('saveToast');
    toast.classList.add('opacity-0', '-translate-y-6', 'pointer-events-none');
    toast.classList.remove('opacity-100', 'translate-y-0');
  }
</script></main>

</body></html>
